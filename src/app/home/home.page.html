<ion-content class="ion-padding">
  <ion-card>
    <img *ngIf="perfil.foto" [src]="perfil.foto" />
    <ion-card-header>
      <ion-card-title>{{ perfil.nome }}</ion-card-title>
      <ion-card-subtitle>@{{ perfil.nome_usuario }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>{{ perfil.biografia || 'Sem biografia' }}</p>
      <ion-button (click)="editarBiografia()">Editar Biografia</ion-button>
      <ion-button (click)="adicionarFoto()">Adicionar Foto</ion-button>
      <ion-button (click)="removerFoto()">Remover Foto</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item *ngFor="let post of perfil.postagens">
      <ion-label>
        <h2>{{ post.nome }}</h2>
        <p>{{ post.texto }}</p>
        <small>{{ post.data }}</small>
      </ion-label>
      <ion-button color="danger" (click)="removerPostagem(post)">Remover</ion-button>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="primary" (click)="novaPostagem()">Nova Postagem</ion-button>
</ion-content>
